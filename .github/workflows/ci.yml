name: CI with OpenBLAS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Install OpenBLAS and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev cmake build-essential pkg-config

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build

    - name: Run Interface Tests
      run: ./build/interface_tests

    - name: Run Performance Tests
      run: ./build/perf_tests